# Publie l'appli Android quand `npx nx release` pousse un tag android@X.Y.Z : rejoue d'abord tous les
# contrôles de la CI (lint, tests, build sans avertissement, Trivy), puis construit l'APK signé et crée
# la release GitHub avec la section du changelog de cette version. Rien n'est publié si un contrôle échoue.
name: Release Android

on:
  push:
    tags: ['android@*']

permissions:
  contents: read

jobs:
  verifier:
    uses: ./.github/workflows/ci.yml

  publier:
    name: APK signé et release GitHub
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v6

      - name: Vérifier que le tag correspond à la version de l'appli
        run: |
          version="${TAG#android@}"
          name=$(sed -n 's/^versionName=//p' apps/android/gradle.properties)
          if [ "$version" != "$name" ]; then
            echo "::error::Le tag $TAG ne correspond pas à versionName=$name (apps/android/gradle.properties)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE absent : voir le guide de création de la clé"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK signé
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :android:assembleRelease
          cp apps/android/build/outputs/apk/release/android-release.apk "chtipasse-$VERSION.apk"

      # Section « ## X.Y.Z » du changelog écrit par Nx Release, jusqu'à la version précédente
      - name: Notes de version
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' apps/android/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Aucune section $VERSION dans apps/android/CHANGELOG.md"
            exit 1
          fi

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "chtipasse-$VERSION.apk" --title "Chtipasse $VERSION" --notes-file notes.md --verify-tag
