# Versions exactes, publiées depuis au moins deux semaines au moment du choix
[versions]
kotlin = "2.4.20"
agp = "9.4.1"
junit = "6.1.3"
konsist = "0.17.3"
nx-gradle = "0.1.25"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
# Fuseaux horaires pour kotlinx-datetime sous Node : dernière version compatible avec le
# @js-joda/core 3.x qu'il embarque (les 2.24+ exigent core ≥ 5.7)
js-joda-timezone = "2.23.0"
# Appli Android (apps/android)
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

[plugins]
# Graphe des projets Gradle pour Nx (@nx/gradle)
nx-project-graph = { id = "dev.nx.gradle.project-graph", version.ref = "nx-gradle" }
